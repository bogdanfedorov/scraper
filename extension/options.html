<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title id="title"></title>
<style>
  body { font-family: system-ui, sans-serif; padding: 16px; min-width: 260px; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  label { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px; }
  .lang-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .path-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .path-row input { font-size: 14px; padding: 6px 8px; }
  .path-hint { font-size: 12px; color: #777; margin: 0; }
  .connection-row { display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; flex: none; }
  .dot-ok { background: #2ecc71; }
  .dot-error { background: #e74c3c; }
</style>
</head>
<body>
<div class="lang-row">
  <label id="languageLabel" for="language"></label>
  <select id="language">
    <option value="uk">Українська</option>
    <option value="en">English</option>
  </select>
</div>

<div class="path-row">
  <label id="savePathLabel" for="savePath"></label>
  <input type="text" id="savePath">
  <p class="path-hint" id="savePathHint"></p>
</div>

<div class="path-row">
  <label id="backendUrlLabel" for="backendUrl"></label>
  <input type="text" id="backendUrl">
  <p class="path-hint" id="backendUrlHint"></p>
  <div class="connection-row">
    <button id="checkConnection"></button>
    <span class="dot" id="connectionDot"></span>
    <span id="connectionMessage"></span>
  </div>
</div>

<h1 id="adaptersHeading"></h1>
<div id="list"></div>

<script src="i18n.js"></script>
<script src="sites/_registry.js"></script>
<script src="sites/dou.js"></script>
<script src="options.js"></script>
</body>
</html>
